<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Håg Test Page</title>
<!--
  Håg dev test page. Connects to a live Home Assistant over WebSocket and
  shows what Håg will see, and Håg itself.

  Run tools/dev-server.py, then open http://127.0.0.1:8117/tools/
  The HA URL and token are kept only in this browser (localStorage) and are
  never written to a file. "Forget" removes them.

  Not part of the plugin install.
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; color: #222; background: #f4f4f4; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  h2 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #555; }
  input { font: inherit; padding: 5px 8px; border: 1px solid #aaa; border-radius: 3px; min-width: 260px; }
  button { font: inherit; padding: 5px 12px; border: 1px solid #888; background: #fff; border-radius: 3px; cursor: pointer; }
  #status { margin: 10px 0; padding: 6px 10px; border-radius: 3px; background: #e8e8e8; }
  #status.ok { background: #dff0e4; }
  #status.err { background: #f6dede; }
  table { border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 3px 10px 3px 0; vertical-align: top; }
  th { color: #666; font-weight: 500; }
  .muted { color: #777; }
  ul { margin: 4px 0; padding-left: 18px; }
  .shapes { display: flex; gap: 6px; margin: 6px 0; }
  .shapes button[aria-pressed="true"] { background: #222; color: #fff; border-color: #222; }
  /* Preview: a fixed-shape frame; Håg fills it. */
  .frame { --ar: 1; aspect-ratio: var(--ar); width: min(100%, calc((100vh - 60px) * var(--ar))); border: 1px solid #222; }
  .frame haag-host { --haag-height: 100%; }
</style>
</head>
<body>

<h1>Håg test page</h1>

<form id="login">
  <label>Home Assistant URL
    <input id="url" type="url" placeholder="http://homeassistant.local:8123" required>
  </label>
  <label>Long-lived access token
    <input id="token" type="password" autocomplete="off" required>
  </label>
  <button type="submit">Connect</button>
  <button type="button" id="forget">Forget</button>
</form>

<div id="status">Not connected.</div>
<div id="preview" hidden>
  <h2>Håg</h2>
  <div class="shapes" id="shapes">
    <button data-ar="1" aria-pressed="true">Square</button>
    <button data-ar="0.5625" aria-pressed="false">Portrait</button>
    <button data-ar="1.7778" aria-pressed="false">Landscape</button>
    <button id="alert-toggle" aria-pressed="true" style="margin-left:12px">Alert</button>
    <label style="flex-direction:row;align-items:center;gap:6px;margin-left:12px">Weather
      <select id="weather"><option value="">Live</option></select>
    </label>
  </div>
  <div class="frame" id="frame"></div>
  <h2>Strategy config</h2>
  <p class="muted" style="margin:0 0 6px">The same options a <code>strategy:</code> block would hold, as JSON (e.g. <code>{"providers": {"calendar": {"calendars": ["calendar.example"]}}}</code>). <code>{"glances": {"test": {"enabled": true}}}</code> turns on Test Glance. Kept in this browser only, never in a file.</p>
  <textarea id="config" rows="6" spellcheck="false" style="width:min(100%,640px);font:12px/1.4 ui-monospace,monospace"></textarea>
  <div><button type="button" id="apply">Apply config</button> <span id="config-msg" class="muted"></span></div>
</div>
<div id="inspector"></div>

<script type="module">
  import { connectHass } from './hass-shim.js';
  import './ha-icon-standin.js';   // HA's ha-icon isn't here outside HA
  import '../dist/haag.js';   // the Håg plugin itself (registers its elements)
  import './glances/test/test.js';   // Test Glance; off until turned on in settings

  const KEY = 'haag-dev-connection';
  const $ = id => document.getElementById(id);
  const status = (text, kind = '') => { $('status').textContent = text; $('status').className = kind; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Browser storage can be unavailable (private windows, blocked storage).
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  const save = v => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch {} };
  const forget = () => { try { localStorage.removeItem(KEY); } catch {} };
  const CONFIG_KEY = 'haag-dev-config';
  const loadConfig = () => { try { return localStorage.getItem(CONFIG_KEY) || '{}'; } catch { return '{}'; } };
  const saveConfig = v => { try { localStorage.setItem(CONFIG_KEY, v); } catch {} };

  let session = null;

  async function connect(url, token) {
    session?.close();
    status('Connecting…');
    try {
      session = await connectHass(url, token, hass => { window.hass = hass; if (host) host.hass = withCondition(hass); });
      save({ url, token });
      const { hass } = session;
      status(`Connected to Home Assistant ${hass.config.version} as ${hass.user.name}${hass.user.is_admin ? ' (admin)' : ''}.`, 'ok');
      await mountHost(hass);
      await inspect(hass);
    } catch (err) {
      // The client library rejects with numeric codes (e.g. 1 = can't
      // connect, 2 = invalid auth); show both forms.
      const codes = { 1: 'cannot connect', 2: 'invalid auth', 3: 'connection lost', 4: 'HA URL required', 5: 'invalid HTTPS to HTTP' };
      status(`Connection failed: ${codes[err] || err?.message || err}`, 'err');
    }
  }

  // Build Håg the same way HA would: ask the strategy for the dashboard,
  // then create the card it lists, with the config it gives.
  let host = null;
  async function mountHost(hass) {
    const Strategy = customElements.get('ll-strategy-dashboard-haag');
    const options = JSON.parse($('config').value || '{}');
    const dashboard = await Strategy.generate({ type: 'custom:haag', ...options }, hass);
    const cardConfig = dashboard.views[0].cards[0];
    host = document.createElement(cardConfig.type.replace('custom:', ''));
    host.setConfig(cardConfig);
    host.hass = withCondition(hass);
    $('frame').replaceChildren(host);
    host.setAlertVisible(alertVisible);
    $('preview').hidden = false;
  }

  // Show/hide the alert row (pressed = shown). Applied again after remounts.
  let alertVisible = true;
  $('alert-toggle').addEventListener('click', e => {
    alertVisible = !alertVisible;
    e.currentTarget.setAttribute('aria-pressed', alertVisible);
    host?.setAlertVisible(alertVisible);
  });

  // Weather picker: overrides every weather entity's condition on this page
  // only, to check each background.
  const CONDITIONS = ['clear-night', 'cloudy', 'exceptional', 'fog', 'hail', 'lightning', 'lightning-rainy', 'partlycloudy',
    'pouring', 'rainy', 'snowy', 'snowy-rainy', 'sunny', 'windy', 'windy-variant'];
  for (const c of CONDITIONS) $('weather').add(new Option(c, c));
  let condition = '';
  function withCondition(hass) {
    if (!condition || !hass) return hass;
    const states = { ...hass.states };
    for (const id in states) if (id.startsWith('weather.')) states[id] = { ...states[id], state: condition };
    return { ...hass, states };
  }
  $('weather').addEventListener('change', e => {
    condition = e.target.value;
    if (host) host.hass = withCondition(window.hass || session.hass);
  });

  $('shapes').addEventListener('click', e => {
    const b = e.target.closest('button[data-ar]');
    if (!b) return;
    $('shapes').querySelectorAll('button[data-ar]').forEach(x => x.setAttribute('aria-pressed', x === b));   // shape buttons only
    $('frame').style.setProperty('--ar', b.dataset.ar);
  });

  // Show what Håg's discovery will have to work with.
  async function inspect(hass) {
    const [entities, devices, areas, floors] = await Promise.all([
      hass.callWS({ type: 'config/entity_registry/list' }),
      hass.callWS({ type: 'config/device_registry/list' }),
      hass.callWS({ type: 'config/area_registry/list' }),
      hass.callWS({ type: 'config/floor_registry/list' }),
    ]);

    // An entity's area is its own, or its device's.
    const deviceArea = Object.fromEntries(devices.map(d => [d.id, d.area_id]));
    const perArea = {};
    for (const e of entities) {
      const area = e.area_id || deviceArea[e.device_id];
      if (area) perArea[area] = (perArea[area] || 0) + 1;
    }

    const floorRows = floors
      .slice().sort((a, b) => (b.level ?? 0) - (a.level ?? 0))
      .map(f => {
        const inFloor = areas.filter(a => a.floor_id === f.floor_id);
        const items = inFloor.map(a => `<li>${esc(a.name)} <span class="muted">(${perArea[a.area_id] || 0} entities)</span></li>`).join('');
        return `<tr><td><b>${esc(f.name)}</b><br><span class="muted">level ${esc(f.level ?? '–')}</span></td><td><ul>${items || '<li class="muted">no areas</li>'}</ul></td></tr>`;
      }).join('');
    const unfloored = areas.filter(a => !a.floor_id).map(a => esc(a.name)).join(', ');

    $('inspector').innerHTML = `
      <h2>Summary</h2>
      <table>
        <tr><th>States</th><td>${Object.keys(hass.states).length}</td></tr>
        <tr><th>Entity registry</th><td>${entities.length}</td></tr>
        <tr><th>Devices</th><td>${devices.length}</td></tr>
        <tr><th>Areas</th><td>${areas.length}</td></tr>
        <tr><th>Floors</th><td>${floors.length}</td></tr>
        <tr><th>Units</th><td>${esc(hass.config.unit_system?.temperature)} · ${esc(hass.config.time_zone)}</td></tr>
      </table>
      <h2>Floors and areas</h2>
      <table>${floorRows}</table>
      ${unfloored ? `<p class="muted">Areas without a floor: ${unfloored}</p>` : ''}`;
  }

  $('login').addEventListener('submit', e => {
    e.preventDefault();
    connect($('url').value.trim(), $('token').value.trim());
  });
  $('forget').addEventListener('click', () => {
    forget();
    session?.close();
    session = null;
    $('token').value = '';
    $('inspector').innerHTML = '';
    status('Forgotten. Not connected.');
  });

  // Reconnect automatically if this browser remembers a connection.
  $('config').value = loadConfig();
  $('apply').addEventListener('click', async () => {
    try {
      JSON.parse($('config').value || '{}');
    } catch (err) {
      $('config-msg').textContent = `Not valid JSON: ${err.message}`;
      return;
    }
    saveConfig($('config').value);
    $('config-msg').textContent = 'Applied.';
    if (session) await mountHost(window.hass || session.hass);   // latest hass
  });

  const saved = load();
  if (saved) {
    $('url').value = saved.url;
    $('token').value = saved.token;
    connect(saved.url, saved.token);
  }
</script>
</body>
</html>
